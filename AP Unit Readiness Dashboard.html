<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AP Unit Readiness Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#111;font-size:12px}
.topbar{background:#1e293b;padding:9px 14px;position:sticky;top:0;z-index:300;
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logo{font-size:14px;font-weight:700;color:#fff}
.sub{font-size:10px;color:#94a3b8}
.spacer{flex:1}
select.ctrl,input.ctrl{font-size:11px;padding:4px 8px;border:1px solid #475569;
  border-radius:6px;background:#334155;color:#fff;height:28px}
option{background:#1e293b}

/* View toggle */
.vtog{display:flex;border:1px solid #475569;border-radius:7px;overflow:hidden}
.vtog button{font-size:11px;font-weight:600;padding:4px 12px;border:none;
  background:#334155;color:#94a3b8;cursor:pointer;height:28px;transition:all .15s}
.vtog button.active{background:#3b82f6;color:#fff}
.vtog button:first-child{border-right:1px solid #475569}

.legend{padding:7px 14px;background:#f8fafc;border-bottom:1px solid #e5e7eb;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:#374151}
.li{display:flex;align-items:center;gap:4px}
.lb{width:12px;height:12px;border-radius:2px;flex-shrink:0}
.lb-done{background:#22c55e}.lb-half{background:#fbbf24}.lb-none{background:#e5e7eb}
.ldiv{width:1px;height:14px;background:#e5e7eb}
.acc{display:inline-flex;align-items:center;justify-content:center;padding:1px 6px;
  border-radius:4px;font-weight:700;font-size:10px;min-width:36px}
.a-yes{background:#dcfce7;color:#166534}.a-mid{background:#fef9c3;color:#854d0e}
.a-no{background:#fee2e2;color:#991b1b}.a-na{background:#f3f4f6;color:#9ca3af;font-weight:400}
.tc{border-radius:5px;padding:2px 7px;font-size:10px;font-weight:600;white-space:nowrap}
.tc-yes{background:#dcfce7;color:#166534}.tc-no{background:#fee2e2;color:#991b1b}
.hb{border-radius:5px;padding:2px 7px;font-size:10px;font-weight:600;white-space:nowrap}
.h0{background:#dcfce7;color:#166534}.h1{background:#dbeafe;color:#1e40af}
.h2{background:#fef9c3;color:#854d0e}.h3{background:#fee2e2;color:#991b1b}.hx{background:#f3f4f6;color:#9ca3af}
.cbar{font-size:11px;color:#6b7280;padding:4px 14px;background:#fff;border-bottom:1px solid #e5e7eb}

/* TABLE SHARED */
.wrap{overflow:auto;padding:12px 14px}
table{border-collapse:separate;border-spacing:0;background:#fff;border-radius:10px;
  border:1px solid #e2e8f0;font-size:11px;width:100%}
thead{position:sticky;top:0;z-index:100}
.hr1{background:#1e293b}
.hr1 th{color:#fff;font-weight:700;font-size:11px;padding:7px 12px;text-align:left;
  border-right:1px solid #334155;border-bottom:2px solid #475569;white-space:nowrap}
.hr1 th.center{text-align:center}
th.stk,td.stk{position:sticky;left:0;z-index:10;background:#fff}
th.stk{z-index:110;background:#1e293b}
.stk-b{border-right:2px solid #cbd5e1!important}
td{padding:0;border-bottom:1px solid #f1f5f9;border-right:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#fafafa}
tr:hover td.stk{background:#fafafa}
tr.sep td{border-top:2px solid #e2e8f0}
tr.course-hdr td{background:#f1f5f9;border-top:2px solid #e2e8f0}

/* STUDENT VIEW */
.sname{padding:7px 12px;font-weight:700;font-size:12px;color:#111;white-space:nowrap;min-width:150px}
.course-cell{padding:5px 8px;min-width:240px}
.cd-wrap{display:flex;flex-direction:column;gap:4px}
.cd-select{width:100%;font-size:11px;padding:4px 7px;border:1px solid #e2e8f0;
  border-radius:6px;background:#f8fafc;color:#1e293b;cursor:pointer;font-weight:600}
.cd-select:focus{outline:none;border-color:#3b82f6}
.cd-blocks{display:flex;gap:2px;flex-wrap:wrap;padding:2px 1px;min-height:16px;align-items:center}
.b{width:12px;height:12px;border-radius:2px;flex-shrink:0;cursor:default}
.b-done{background:#22c55e}.b-half{background:#fbbf24}.b-none{background:#e5e7eb}
.cd-none{font-size:10px;color:#d1d5db;padding:2px}
.acc-cell{padding:5px 8px;text-align:center;min-width:54px}
.time-cell{padding:5px 10px;text-align:center;min-width:130px}
.hrs-cell{padding:5px 10px;text-align:center;min-width:95px}

/* COURSE VIEW */
.course-label{padding:8px 12px;font-weight:700;font-size:12px;color:#1e293b;
  white-space:nowrap;min-width:200px}
.course-sub{font-size:10px;color:#64748b;font-weight:400;display:block}
.cv-sname{padding:6px 12px;font-size:11px;color:#374151;min-width:150px}
.cv-blocks{display:flex;gap:2px;flex-wrap:wrap;padding:5px 8px;align-items:center;min-width:140px}
</style>
</head>

<div class="topbar">
  <span class="logo">AP Unit Readiness</span>
  <span class="sub">53 students &middot; Mar 16 2026</span>

  <input class="ctrl" id="srch" placeholder="Search&hellip;" oninput="go()" style="width:130px">
  <select class="ctrl" id="filt" onchange="go()">

</div>

<div class="legend">

  <span class="li"><span class="acc a-yes">&ge;80%</span></span>
  <span class="li"><span class="acc a-mid">65&ndash;79%</span></span>
  <span class="li"><span class="acc a-no">&lt;65%</span></span>
  <span class="li"><span class="acc a-na">&mdash;</span>&nbsp;no data</span>
  <div class="ldiv"></div>
  <span class="li"><span class="tc tc-yes">&#x1F7E2; On track</span></span>
  <span class="li"><span class="tc tc-no">&#x1F534; Low activity</span></span>
  <div class="ldiv"></div>
  <span class="li"><span class="hb h0">&#x2713; Score 5</span></span>
  <span class="li"><span class="hb h1">&le;2h</span></span>
  <span class="li"><span class="hb h2">2&ndash;5h</span></span>
  <span class="li"><span class="hb h3">5h+</span></span>
</div>

<div class="cbar" id="cbar">Loading&hellip;</div>

/* ── HELPERS ─────────────────────────────────────────────── */
function accCls(v){ return v===null||v===undefined?'a-na':v>=80?'a-yes':v>=65?'a-mid':'a-no'; }
function accTxt(v){ return v!==null&&v!==undefined?v+'%':'&mdash;'; }
function hrsInfo(h){
  if(h===null||h===undefined) return ['hx','No test'];
  if(h===0)  return ['h0','&#x2713; Score 5'];
  if(h<=2)   return ['h1', h+'h to 5'];
  if(h<=5)   return ['h2', h+'h to 5'];
  return ['h3', h+'h to 5'];
}
function avg(arr){
  const f=arr.filter(v=>v!==null&&v!==undefined);
  return f.length?Math.round(f.reduce((a,b)=>a+b,0)/f.length*10)/10:null;
}
function blockHtml(units,total){
  if(!units||units.length===0) return '<span class="cd-none">not enrolled</span>';
  let h='';
  units.forEach(u=>{
    const cls=u.status==='COMPLETE'?'b-done':u.comp>0?'b-half':'b-none';
    const tip=u.status==='COMPLETE'?'Complete':u.comp>0?'In progress ('+u.comp+'%)':'Not started';
    h+='<span class="b '+cls+'" title="'+tip+'"></span>';
  });
  for(let i=units.length;i<total;i++) h+='<span class="b b-none"></span>';
  return h;
}

function onCourseChange(idx){
  const data=RMAP[idx];
  if(!data) return;
  const course=document.getElementById('sel_'+idx).value;
  const units=data.courses[course]||[];
  const total=CU[course]||1;
  const mcq=avg(units.map(u=>u.mcq));
  const frq=avg(units.map(u=>u.frq));
  document.getElementById('blk_'+idx).innerHTML=blockHtml(units,total);
  document.getElementById('mcq_'+idx).innerHTML='<span class="acc '+accCls(mcq)+'">'+accTxt(mcq)+'</span>';
  document.getElementById('frq_'+idx).innerHTML='<span class="acc '+accCls(frq)+'">'+accTxt(frq)+'</span>';
}

function renderCourseView(rows){
  // Build course → [student rows]
  const byCourseMaps = {};
  CO.forEach(c=>{ byCourseMaps[c]=[]; });

  rows.forEach(r=>{
    Object.keys(r.courses).forEach(c=>{
      if(byCourseMaps[c]) byCourseMaps[c].push(r);
    });
  });

  // Only show courses that have students in current filter
  const activeCourses = CO.filter(c=>byCourseMaps[c].length>0);

  let tb='';
  activeCourses.forEach((course,ci)=>{
    const students = byCourseMaps[course];
    const total = CU[course]||1;
    const n = students.length;

    students.forEach((r,si)=>{
      const units = r.courses[course]||[];
      const mcq   = avg(units.map(u=>u.mcq));
      const frq   = avg(units.map(u=>u.frq));
      const tCls  = r.putting_time?'tc-yes':'tc-no';
      const tIcon = r.putting_time?'&#x1F7E2;':'&#x1F534;';
      const tTxt  = Math.round(r.xp_weekly).toLocaleString()+' XP &middot; '+r.daily_mins+'m/d';
      const [hCls,hTxt] = hrsInfo(r.hrs_to_5);

      if(si===0){
        // Course header row — sticky left col spans all students
        tb+='<tr class="'+(ci>0?'sep':'')+'">'
          +'<td class="stk stk-b course-label" rowspan="'+n+'">'
            +course.replace(/&/g,'&amp;')
            +'<span class="course-sub">'+n+' student'+(n!==1?'s':'')+' &middot; '+total+' units</span>'
          +'</td>';
      } else {
        tb+='<tr>';
      }

      tb+='<td class="cv-sname">'+r.student+'</td>'
        +'<td><div class="cv-blocks">'+blockHtml(units,total)+'</div></td>'
        +'<td class="acc-cell"><span class="acc '+accCls(mcq)+'">'+accTxt(mcq)+'</span></td>'
        +'<td class="acc-cell"><span class="acc '+accCls(frq)+'">'+accTxt(frq)+'</span></td>'
        +'<td class="time-cell"><span class="tc '+tCls+'">'+tIcon+' '+tTxt+'</span></td>'
        +'<td class="hrs-cell"><span class="hb '+hCls+'">'+hTxt+'</span></td>'
        +'</tr>';
    });
  });

  document.getElementById('tbody-c').innerHTML = tb ||
    '<tr><td colspan="7" style="padding:2rem;text-align:center;color:#9ca3af">No students match</td></tr>';
}

    if(q&&!r.student.toLowerCase().includes(q)) return false;
    if(f==='notime') return !r.putting_time;
    if(f==='notest') return r.pt_score===null;
    if(f==='low')    return r.pt_score!==null&&r.pt_score<=2;
    if(f==='mcq')    return r.pt_mcq!==null&&r.pt_mcq<80;
    if(f==='frq')    return r.pt_frq!==null&&r.pt_frq<80;
    if(f==='hrs')    return r.hrs_to_5!==null&&r.hrs_to_5>=3;
    return true;
  });

  const label = currentView==='course'
    ? 'Showing '+[...new Set(rows.flatMap(r=>Object.keys(r.courses)))].filter(c=>rows.some(r=>r.courses[c])).length+' courses &middot; '+rows.length+' students'
    : 'Showing '+rows.length+' student'+(rows.length!==1?'s':'');
  document.getElementById('cbar').innerHTML = label;

  if(currentView==='student') renderStudentView(rows);
  else renderCourseView(rows);
}

buildStudentHeader();
buildCourseHeader();
go();
</script>
</body>
</html>
